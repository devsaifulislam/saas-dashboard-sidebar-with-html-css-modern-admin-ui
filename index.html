<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaaS Dashboard Sidebar with HTML &amp; CSS 📊 | Modern Admin UI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<aside class="dashboard-sidebar">
  <div class="sidebar-header">
    <a href="#" class="brand">
      <span class="brand-logo">N</span>

      <div>
        <strong>NexaFlow</strong>
        <small>Business Suite</small>
      </div>
    </a>

    <button class="collapse-button" type="button" aria-label="Collapse sidebar">
      ‹
    </button>
  </div>

  <div class="workspace-switcher">
    <span class="workspace-logo">WS</span>

    <div>
      <small>WORKSPACE</small>
      <strong>WebEch Studio</strong>
    </div>

    <span class="switch-icon">⌄</span>
  </div>

  <nav class="sidebar-navigation">
    <p class="menu-label">MAIN MENU</p>

    <a href="#" class="menu-item active">
      <span class="menu-icon">⌂</span>
      <span>Overview</span>
    </a>

    <a href="#" class="menu-item">
      <span class="menu-icon">▦</span>
      <span>Analytics</span>
      <small class="menu-badge">NEW</small>
    </a>

    <a href="#" class="menu-item">
      <span class="menu-icon">▣</span>
      <span>Projects</span>
      <small class="menu-count">12</small>
    </a>

    <a href="#" class="menu-item">
      <span class="menu-icon">♙</span>
      <span>Customers</span>
    </a>

    <a href="#" class="menu-item">
      <span class="menu-icon">◉</span>
      <span>Messages</span>
      <small class="message-count">4</small>
    </a>

    <p class="menu-label">MANAGEMENT</p>

    <a href="#" class="menu-item">
      <span class="menu-icon">▤</span>
      <span>Invoices</span>
    </a>

    <a href="#" class="menu-item">
      <span class="menu-icon">◇</span>
      <span>Integrations</span>
    </a>

    <a href="#" class="menu-item">
      <span class="menu-icon">⚙</span>
      <span>Settings</span>
    </a>
  </nav>

  <div class="upgrade-card">
    <span class="upgrade-icon">✦</span>
    <strong>Upgrade to Pro</strong>
    <p>Unlock reports, automation and unlimited projects.</p>
    <button type="button">View Plans</button>
  </div>

  <div class="sidebar-profile">
    <div class="profile-avatar">
      <img
        src="https://i.pravatar.cc/100?img=12"
        alt="Saiful Islam"
      >
      <span></span>
    </div>

    <div class="profile-info">
      <strong>Saiful Islam</strong>
      <small>Administrator</small>
    </div>

    <button type="button" aria-label="Profile options">⋮</button>
  </div>
</aside>
</body>
</html>
